<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive rating component</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Overpass:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="rating-state container">
        <div class="icon-star">
            <img src="./images/icon-star.svg" alt="">
        </div>

        <h1> How did we do? </h1>

        <p> Please let us know how we did with your support request. All feedback is appreciated to help us improve our offering!
        </p>

        <section class="rating">
            <button class="btn-rate">1</button>
            <button class="btn-rate">2</button>
            <button class="btn-rate">3</button>
            <button class="btn-rate">4</button>
            <button class="btn-rate">5</button>
        </section>

        <button class="btn-submit">
            SUBMIT
        </button>
    </main>

    <main class="thank-you container hidden">
        <div class="icon-thank-you">
            <img src="./images/illustration-thank-you.svg" alt="">
        </div>

        <span class="rate-number"> You selected 0 out of 5  </span>

        <h1> Thank you! </h1>

        <p> 
            We appreciate you taking the time to give a rating. If you ever need
            more support, don’t hesitate to get in touch!
        </p>
    </main>

    <script src="app.js"></script>
</body>
</html>
